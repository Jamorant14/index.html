<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hexfront – 200×200 Hex Strategy</title>
<style>
  :root{--bg:#0f1520;--ink:#f2f5fa;--gold:#f5c542}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;touch-action:none;-webkit-touch-callout:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #game:active{cursor:grabbing}
  #topwrap{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none;z-index:5}
  #topbar{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%;padding:6px 8px;border-radius:14px;background:rgba(15,21,32,.86);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}
  .natchip{display:flex;align-items:center;font-weight:700;font-size:13px;max-width:36vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .yr{display:flex;flex-direction:column;line-height:1.15;padding:0 10px;border-left:1px solid rgba(255,255,255,.15);border-right:1px solid rgba(255,255,255,.15)}
  .yr b{font-size:16px;color:var(--gold);white-space:nowrap}.yr small{font-size:10px;opacity:.65;white-space:nowrap}
  .res{display:flex;gap:6px;flex:1 1 auto;min-width:0}
  .chip{display:flex;align-items:center;gap:5px;padding:3px 7px;background:#101a2a;border-radius:9px;min-width:0}
  .chip svg{width:20px;height:20px;flex:none}.chip b{display:block;font-size:13px;line-height:1.1}.chip i{display:block;font-style:normal;font-size:10px;line-height:1.1;color:#7ee08a}.chip i.neg{color:#ff8a8a}
  #hud{pointer-events:none;max-width:min(94vw,540px);padding:5px 10px;border-radius:10px;background:rgba(15,21,32,.74);font-size:12px;line-height:1.4}
  #hud:empty{display:none}#hud b{color:#fff}#hud small{display:block;opacity:.65;font-size:11px}
  @media (max-width:640px){.res{order:3;flex:1 1 100%}.res .chip{flex:1 1 0;justify-content:center}}
  #corner{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px}
  #next{min-height:48px;padding:0 20px;font:800 15px/1 system-ui,sans-serif;letter-spacing:.06em;color:#fff;cursor:pointer;background:rgba(15,21,32,.88);
        border:2px solid rgba(255,255,255,.35);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  #next:active{transform:scale(.96)}
  #next.ready{color:#2a1c00;background:linear-gradient(180deg,#ffe08a,#f5c542);border-color:#fff3c4;animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(245,197,66,.3),0 6px 20px rgba(0,0,0,.5)}50%{box-shadow:0 0 0 10px rgba(245,197,66,.1),0 0 36px rgba(245,197,66,.7)}}
  #mini{display:block;flex:none;border:2px solid rgba(255,255,255,.35);border-radius:8px;background:#141b27;box-shadow:0 6px 20px rgba(0,0,0,.5);touch-action:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:16px;letter-spacing:.08em;z-index:9}
  @media (max-width:560px) and (orientation:portrait){#corner{flex-direction:column;align-items:stretch;gap:8px}#next{min-height:44px;padding:0 12px}}
  [hidden]{display:none!important}
  .sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(255,255,255,.6)}
  #log{position:fixed;left:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 58px);max-width:min(62vw,420px);font-size:12px;line-height:1.35;pointer-events:none;text-shadow:0 1px 3px #000}
  #log div{background:rgba(15,21,32,.72);padding:3px 8px;margin-top:3px;border-radius:6px}
  #act,#navbtn{position:fixed;min-height:44px;padding:0 16px;font:800 14px/1 system-ui,sans-serif;letter-spacing:.05em;color:#fff;cursor:pointer;background:rgba(15,21,32,.88);border:2px solid rgba(255,255,255,.35);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  #act{left:10px;bottom:max(10px,env(safe-area-inset-bottom));color:#2a1c00;background:linear-gradient(180deg,#ffe08a,#f5c542);border-color:#fff3c4;min-height:48px}
  #navbtn{position:static;min-height:38px;padding:0 12px;margin-left:auto;flex:none}
  #setup,#modal,#menu,#join,#lobby{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(8,12,20,.88)}
  #setup,#menu,#join,#lobby{background:radial-gradient(ellipse at 30% 20%,#223654,#0b111c 70%)}
  #loading{z-index:30}
  .card{width:min(540px,100%);max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:#182233;border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .card h1,.card h2{margin:0 0 4px;font-size:22px}.card h3{margin:16px 0 6px;font-size:14px;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
  .card h2 small{font-size:12px;opacity:.6;font-weight:400}.sub{opacity:.65;font-size:13px;margin:2px 0 8px}.msg{color:#ffd54a;font-size:13px}
  .card label{display:block;margin:14px 0 6px;font-size:12px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .card button,.card select{min-height:42px;padding:0 12px;font:600 14px system-ui,sans-serif;color:#fff;background:#25344d;border:1px solid rgba(255,255,255,.2);border-radius:10px;cursor:pointer}
  .seg button{flex:1 1 72px}.seg small{display:block;font-size:10px;opacity:.7;font-weight:400}
  .card button.on,button.big{background:linear-gradient(180deg,#ffe08a,#f5c542);color:#2a1c00;border-color:#fff3c4;font-weight:800}
  .card button.red{background:#7a2530}.card button:disabled{opacity:.4}
  button.big{width:100%;min-height:50px;margin-top:16px;font-size:16px;letter-spacing:.06em}
  .card select{width:100%}.card input[type=range]{width:100%;height:34px;accent-color:#f5c542}
  #summary{margin:14px 0 0;font-size:13px;opacity:.7}
  .tr{list-style:none;margin:8px 0;padding:0;font-size:13px;line-height:1.5}.tr li{padding:1px 0}.pro{color:#8be08b}.con{color:#ff9a9a}.sp{color:#ffd54a}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;font-size:11px;opacity:.9}.grid div{background:#101a2a;border-radius:8px;padding:6px 8px}.grid b{display:block;font-size:14px;color:#fff}
  .row{display:flex;gap:8px;flex-wrap:wrap}.nat{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:14px}
  .nat>div:first-child{flex:1;min-width:0}.bar{height:5px;background:#0d1522;border-radius:3px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%}
  @media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
  .ug{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}.ug td{padding:4px;border-top:1px solid rgba(255,255,255,.08);vertical-align:top}.ug td:last-child{opacity:.7}
  .tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}
  .cyl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}.cy{display:flex;align-items:center;gap:8px;background:#101a2a;border-radius:8px;padding:7px 9px;font-size:13px}
  .cy svg{width:20px;height:20px;flex:none}.cy span{flex:1;opacity:.8}.cy b{color:#fff}
  .pbox{background:#101a2a;border-radius:10px;padding:10px;margin:8px 0}.pbox small{opacity:.7}
  .lgA,.lgB{display:inline-block;width:12px;height:10px;margin:0 4px 0 2px;vertical-align:-1px;border-radius:2px}.lgA{background:rgba(255,179,71,.55);border:3px solid #ffb347;outline:1px solid #000}.lgB{background:rgba(143,184,255,.15);border:1px solid rgba(143,184,255,.7)}
  .card h3 small{text-transform:none;letter-spacing:0;font-weight:400;opacity:.7}
  #bl{position:fixed;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));width:min(400px,calc(100vw - 166px));display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:4}
  #log{position:static;max-width:none}
  #upanel{pointer-events:auto;background:rgba(15,21,32,.92);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 10px 10px;box-shadow:0 8px 24px rgba(0,0,0,.5);backdrop-filter:blur(6px);max-height:46vh;overflow:auto;touch-action:pan-y;font-size:12px}
  .uic{display:inline-block;flex:none;background-image:var(--sheet);background-repeat:no-repeat;border-radius:50%}
  .uh{display:flex;align-items:center;gap:9px}.uico{border-radius:50%;line-height:0;flex:none}.ut{flex:1;min-width:0}.ut b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ut small{opacity:.65;display:block;font-size:11px}
  .hpb{height:4px;background:#0d1522;border-radius:2px;margin-top:4px;overflow:hidden}.hpb i{display:block;height:100%;background:#6c6}
  .ux{min-height:30px;width:30px;padding:0;border-radius:8px;background:#25344d;color:#fff;border:1px solid rgba(255,255,255,.2);font-size:16px;cursor:pointer;flex:none}
  .ust{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0 5px}.ust span{background:#101a2a;border-radius:7px;padding:2px 7px;font-size:11px;white-space:nowrap}.ust b{color:#fff}
  .uab{opacity:.75;font-size:11px;line-height:1.35;margin-bottom:5px}.uact{display:flex;flex-wrap:wrap;gap:5px}
  .uact button{min-height:36px;padding:0 10px;border-radius:9px;font:700 12px system-ui,sans-serif;color:#fff;background:#25344d;border:1px solid rgba(255,255,255,.22);cursor:pointer}
  .uact button.go{background:linear-gradient(180deg,#ffe08a,#f5c542);color:#2a1c00;border-color:#fff3c4}.uact button.dng{background:#5a2330}.uact button:disabled{opacity:.38;cursor:default}
  .uhint{color:#ffb78a;font-size:11px;margin-top:4px}
  .ugrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.ubtn{display:flex!important;align-items:center;gap:8px;text-align:left;padding:5px 8px!important;min-height:46px!important}
  .ubtn span:last-child{display:block;line-height:1.15}.ubtn small{display:block;opacity:.7;font-weight:400;font-size:11px}.ubtn b{font-size:12px}
  .rosterbox{max-height:300px;overflow:auto;border:1px solid rgba(255,255,255,.1);border-radius:10px;margin:8px 0}.rost{margin:0}.rost th{font-size:10px;opacity:.6;text-align:left;padding:4px}.rost td{vertical-align:middle}.rost td small{display:block;opacity:.6;font-size:10px}
  .rost tr.cat td{background:#101a2a;font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;opacity:.9}
  .gpb{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0}.gpb .bar{flex:1;margin:0}.gpb span:first-child{width:92px}
  input{-webkit-user-select:text;user-select:text;width:100%;min-height:44px;padding:0 12px;font:600 16px system-ui,sans-serif;color:#fff;background:#101a2a;border:1px solid rgba(255,255,255,.22);border-radius:10px}
  input.code{font:800 34px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.35em;text-align:center;text-transform:uppercase;min-height:64px;margin:12px 0}
  .card .alt{width:100%;margin-top:10px;background:#1c2940}.card .alt2{background:linear-gradient(180deg,#9fe3f5,#37b6dc);color:#052a38;border-color:#d8f6ff}
  .room{font:800 54px/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;text-align:center;color:#ffd54a;background:#101a2a;border-radius:14px;padding:14px 0 14px .3em;margin:10px 0;user-select:all;-webkit-user-select:all}
  .plist{margin:8px 0}.prow{display:flex;align-items:center;gap:9px;padding:7px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:15px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:#888}.dot.ok{background:#5ad66f}.dot.bad{background:#e55}.dot.warn{background:#f5c542;animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  #netstat{pointer-events:auto;align-self:flex-end;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;border-radius:999px;background:rgba(15,21,32,.88);border:1px solid rgba(255,255,255,.16);font-size:12px;line-height:1.15}
  #netstat b{display:block;font-size:12px}#netstat small{display:block;opacity:.7;font-size:10px}
  #netstat button{min-height:26px;padding:0 9px;border-radius:999px;font:700 11px system-ui,sans-serif;color:#fff;background:#25344d;border:1px solid rgba(255,255,255,.2);cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="topwrap">
  <div id="topbar"><div class="natchip" id="natchip"></div><div class="yr" id="yr"></div><div class="res" id="res"></div><button id="navbtn" type="button">Nation</button></div>
  <div id="hud"></div>
  <div id="netstat" hidden></div>
</div>
<div id="corner"><button id="next" type="button">Next Turn</button><canvas id="mini"></canvas></div>
<div id="loading" hidden>Generating world…</div>
<div id="bl"><div id="log"></div><div id="upanel" hidden></div></div>
<div id="modal" hidden><div class="card" id="mcard"></div></div>
<div id="menu"><div class="card">
  <h1>Hexfront</h1><p class="sub">Turn-based hex strategy · play with friends on iPhone, Android and PC.</p>
  <label>Your name</label><input id="pname" maxlength="14" autocomplete="off" placeholder="Player">
  <button class="big" id="mCreate" type="button">Create Game</button>
  <button class="big alt2" id="mJoin" type="button">Join Game</button>
  <div id="mRejoin"></div>
  <button type="button" id="mSolo" class="alt">Single player / hot-seat</button>
</div></div>
<div id="join" hidden><div class="card">
  <h1>Join a game</h1><p class="sub">Enter the 4-character room code the host shows on their screen.</p>
  <input id="jcode" class="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AX79">
  <button class="big" id="jgo" type="button">Join</button><button type="button" id="jback" class="alt">Back</button><p class="sub" id="jmsg"></p>
</div></div>
<div id="lobby" hidden><div class="card"><h1>Lobby</h1><div id="lobbyBody"></div></div></div>
<div id="setup" hidden><div class="card">
  <h1 id="setupTitle">Hexfront</h1><p class="sub" id="setupSub">Configure your world, then take command of a nation.</p>
  <label>Map size</label><div class="seg" id="sizeSeg"></div>
  <label>Rival nations: <b id="rivVal"></b></label><input type="range" id="riv" min="1" max="12" value="5">
  <div id="humBox"><label>Human players (hot-seat; AI controls every other nation)</label><div class="seg" id="humSeg"></div>
  <div id="picks"></div></div>
  <label>AI difficulty</label><div class="seg" id="diffSeg"></div>
  <p id="summary"></p>
  <button class="big" id="start" type="button">Start Game</button>
  <button type="button" id="setupBack" class="alt">Back</button>

<script>
(() => {
'use strict';

/* ================= CONFIG & HEX MATH =================
   Axial (q,r) is the logical coordinate system; tiles live in flat typed arrays indexed by
   i = r*N + c with c = q + (r>>1) (an "offset" packing of axial coords -> 40,000 entries, zero objects). */
let N = 200, NN = N * N; // chosen on the setup screen
const S = 32, R3 = Math.sqrt(3), SW = S * R3, VIS = 2, K = 2, MAXMP = 2;
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const idx  = (q, r) => { if (r < 0 || r >= N) return -1; const c = q + (r >> 1); return c < 0 || c >= N ? -1 : r * N + c; };
const rOf  = i => (i / N) | 0, qOf = i => { const r = (i / N) | 0; return i - r * N - (r >> 1); };
const posX = i => { const r = (i / N) | 0; return SW * (i - r * N + (r & 1) * .5); }, posY = i => 1.5 * S * ((i / N) | 0);
const hexDist = (a, b) => { const dq = qOf(a) - qOf(b), dr = rOf(a) - rOf(b); return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2; };
function nbr(i) { const r = rOf(i), q = qOf(i), a = []; for (let d = 0; d < 6; d++) { const j = idx(q + DIRS[d][0], r + DIRS[d][1]); if (j >= 0) a.push(j); } return a; }
function toHex(x, y) { // pixel -> axial via cube rounding
  const fq = (R3 / 3 * x - y / 3) / S, fr = (2 / 3 * y) / S, fs = -fq - fr;
  let q = Math.round(fq), r = Math.round(fr), s = Math.round(fs);
  const dq = Math.abs(q - fq), dr = Math.abs(r - fr), ds = Math.abs(s - fs);
  if (dq > dr && dq > ds) q = -r - s; else if (dr > ds) r = -q - s;
  return { q, r };
}
function hexPath(c, x, y, s) { c.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 30); c[i ? 'lineTo' : 'moveTo'](x + s * Math.cos(a), y + s * Math.sin(a)); } c.closePath(); }

/* ================= TERRAIN TABLE ================= */

  else if (a === 'share') { const link = inviteLink(), txt = `Join my Hexfront game: room ${net.code}`; if (navigator.share) navigator.share({ title: 'Hexfront', text: txt, url: link }).catch(() => {}); else if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => lobbyMsg('Invite link copied.')).catch(() => lobbyMsg(link)); else lobbyMsg(link); }
  else if (a === 'start') hostBegin();
});
$('netstat').addEventListener('click', e => { const b = e.target.closest('[data-net]'); if (!b) return; if (b.dataset.net === 'leave') { if (typeof confirm === 'undefined' || confirm('Leave this multiplayer game?')) netLeave(); } else if (b.dataset.net === 'skip') { if (typeof confirm === 'undefined' || confirm(`Skip ${netNameOf(net.active)}'s turn?`)) hostSkip(); } });
function hostBegin() { // host presses Start in the lobby: the room closes to newcomers and the world is generated
  if (net.role !== 'host' || net.started || !net.peer) return;
  cfg.humans = net.players.length; cfg.picks = Array(MAXP).fill(-1); cfg.rivals = clamp(cfg.rivals, 1, Math.min(SIZES[cfg.size].max, 18 - cfg.humans));
  broadcastLobby(); for (const p of net.players) if (p.conn) sendSmall(p.conn, { t: 'lobby', players: lobbyList(), cfg: lobbyCfgNow(), started: true, starting: true });
  startGame();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && net.on && net.role === 'guest') netTick(); });
function checkInviteLink() { try { const q = new URLSearchParams(location.search).get('join'); if (q) { $('jcode').value = String(q).toUpperCase().slice(0, 4); showScreen('join'); } } catch (e) {} } // ?join=AX79 opens the Join screen

/* ================= BOOT ================= */
function startGame() {
  for (const sc of SCREENS) $(sc).hidden = true; $('loading').hidden = false;
  setTimeout(() => {
    const n = SIZES[cfg.size].n; allocWorld(n); generateWorld(); if (!SPR.length) { buildSprites(); buildImprSprites(); } initMinimap();
    Object.assign(WORLD, { ox: -SW / 2, oy: -.75 * S, w: SW * (N + .5), h: 1.5 * S * N });
    cities.clear(); occ.clear(); logs.length = 0; units = []; uid = 1; turn = 1; anyMark = new Uint8Array(NN); anyExplored = [];
    createNations(); buildNationSprites(); placeNations(); fogs = humans.map(() => newFog());
    curH = 0; me = humans[0]; visList = []; resize(); cam.z = Math.max(cam.minZ, W < 600 ? .9 : 1.1);
    started = true; if (net.on) netHostBegin(); beginHumanTurn(true); $('loading').hidden = true; if (!frameOn) { frameOn = true; requestAnimationFrame(frame); }
  }, 40);
}
addEventListener('resize', () => { resize(); clampCam(); });
renderSetup(); renderMenu(); showScreen('menu'); checkInviteLink();

})();
</script>
